<ion-split-pane
  contentId="main"
  [style.--side-width]="menuW"
  [style.--side-min-width]="menuW"
  [style.--side-max-width]="menuW"
>
  <ion-menu
    contentId="main"
    type="push"
    class="sf-menu"
    [style.--width]="menuW"
    [style.--min-width]="menuW"
    [style.--max-width]="menuW"
  >
    <ion-content class="sf-menu__content">

      <div class="sf-wrap">

        <!-- Brand -->
        <a class="sf-brand"
           routerLink="/panel"
           routerLinkActive="router-link-active"
           routerDirection="root">
          SmartFlet
        </a>

        <!-- Usuario -->
        <div class="sf-user" *ngIf="usuario as u">
          <div class="sf-user__row">
            <div class="sf-user__avatar">
              <ion-icon name="person-circle-outline"></ion-icon>
            </div>

            <div class="sf-user__info">
              <div class="sf-user__welcome">Bienvenido</div>
              <div class="sf-user__name">{{ u.apellidos || 'Usuario' }}</div>
              <div class="sf-user__mail">{{ u.email }}</div>
            </div>
          </div>
        </div>

        <!-- Fallback -->
        <div class="sf-user" *ngIf="!usuario">
          <div class="sf-user__row">
            <div class="sf-user__avatar">
              <ion-icon name="person-circle-outline"></ion-icon>
            </div>
            <div class="sf-user__info">
              <div class="sf-user__welcome">Bienvenido</div>
              <div class="sf-user__name">Usuario</div>
              <div class="sf-user__mail">—</div>
            </div>
          </div>
        </div>

        <!-- Viajes -->
        <div class="sf-section">
          <div class="sf-title">Viajes</div>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/viajes" routerDirection="root">
              Detalles de Viaje
            </a>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/viajes" routerDirection="root">
              Rutas
            </a>
          </ion-menu-toggle>
        </div>

        <!-- Operadores -->
        <div class="sf-section">
          <div class="sf-title">Operadores</div>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/asignaciones" routerDirection="root">
              Asignaciones
            </a>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/panel/operadores/listado" routerDirection="root">
              Listado de Operadores
            </a>
          </ion-menu-toggle>
        </div>

        <!-- Unidades -->
        <div class="sf-section">
          <div class="sf-title">Unidades</div>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/panel/unidades/reportes" routerDirection="root">
              Reportes
            </a>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item" routerLink="/panel/unidades/detalle" routerDirection="root">
              Detalle de Unidades
            </a>
          </ion-menu-toggle>
        </div>

        <!-- ✅ Control de Usuarios (solo ADMIN: role_id === 1) -->
        <div class="sf-section" *ngIf="(usuario?.role_id ?? 0) === 1">
          <div class="sf-title">Control de Usuarios</div>

          <ion-menu-toggle auto-hide="false">
            <a class="sf-item"
               routerLink="/register"
               routerDirection="root">
              Registrar usuario
            </a>
          </ion-menu-toggle>
        </div>

        <!-- Logout -->
        <div class="sf-footer">
          <button class="sf-logout" type="button" (click)="logout()">
            <span>Cerrar Sesión</span>
            <ion-icon name="log-out-outline"></ion-icon>
          </button>
        </div>

      </div>
    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-split-pane>
