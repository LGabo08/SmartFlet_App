<ion-split-pane
  contentId="main"
  [style.--side-width]="menuW"
  [style.--side-min-width]="menuW"
  [style.--side-max-width]="menuW"
>
  <ion-menu
    contentId="main"
    type="push"
    class="sf-menu"
    [style.--width]="menuW"
    [style.--min-width]="menuW"
    [style.--max-width]="menuW"
  >
    <ion-content class="sf-menu__content">

      <div class="sf-wrap">

        <!-- ===== BRAND ===== -->
        <a
          class="sf-brand"
          routerLink="/panel"
          routerLinkActive="router-link-active"
          routerDirection="root"
        >
          SmartFlet
        </a>

        <!-- ===== USUARIO (SIN ICONO) ===== -->
        <div class="sf-user" *ngIf="usuario as u; else noUser">
          <div class="sf-user__info">
            <div class="sf-user__welcome">Bienvenido</div>
            <div class="sf-user__name">{{ u.nombre || 'Usuario' }}</div>
            <div class="sf-user__mail">{{ u.email }}</div>
          </div>
        </div>

        <ng-template #noUser>
          <div class="sf-user">
            <div class="sf-user__info">
              <div class="sf-user__welcome">Bienvenido</div>
              <div class="sf-user__name">Usuario</div>
              <div class="sf-user__mail">—</div>
            </div>
          </div>
        </ng-template>

        <!-- ===== MENÚ CON DROPDOWNS ===== -->
        <ion-accordion-group class="sf-acc" [multiple]="false" value="viajes">

          <!-- VIAJES -->
          <ion-accordion value="viajes" class="sf-acc__item">
            <div slot="header" class="sf-acc__header">
              <span>Viajes</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>

            <div slot="content" class="sf-acc__content">
              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/viajes" routerDirection="root">
                  Detalles de Viaje
                </a>
              </ion-menu-toggle>

              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/viajes" routerDirection="root">
                  Rutas
                </a>
              </ion-menu-toggle>
            </div>
          </ion-accordion>

          <!-- OPERADORES -->
          <ion-accordion value="operadores" class="sf-acc__item">
            <div slot="header" class="sf-acc__header">
              <span>Operadores</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>

            <div slot="content" class="sf-acc__content">
              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/asignaciones" routerDirection="root">
                  Asignaciones
                </a>
              </ion-menu-toggle>

              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/panel/operadores/listado" routerDirection="root">
                  Listado de Operadores
                </a>
              </ion-menu-toggle>
            </div>
          </ion-accordion>

          <!-- UNIDADES -->
          <ion-accordion value="unidades" class="sf-acc__item">
            <div slot="header" class="sf-acc__header">
              <span>Unidades</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>

            <div slot="content" class="sf-acc__content">
              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/panel/unidades/reportes" routerDirection="root">
                  Reportes
                </a>
              </ion-menu-toggle>

              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/panel/unidades/detalle" routerDirection="root">
                  Detalle de Unidades
                </a>
              </ion-menu-toggle>
            </div>
          </ion-accordion>

          <!-- CONTROL DE USUARIOS (ADMIN) -->
          <ion-accordion
            *ngIf="(usuario?.role_id ?? 0) === 1"
            value="usuarios"
            class="sf-acc__item"
          >
            <div slot="header" class="sf-acc__header">
              <span>Control de Usuarios</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </div>

            <div slot="content" class="sf-acc__content">
              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/register" routerDirection="root">
                  Registrar usuario
                </a>
              </ion-menu-toggle>

              <ion-menu-toggle auto-hide="false">
                <a class="sf-item" routerLink="/usuarios" routerDirection="root">
                  Listado de usuarios
                </a>
              </ion-menu-toggle>
            </div>
          </ion-accordion>

        </ion-accordion-group>

        <!-- ===== LOGOUT ===== -->
        <div class="sf-footer">
          <button class="sf-logout" type="button" (click)="logout()">
            <span>Cerrar sesión</span>
            <ion-icon name="log-out-outline"></ion-icon>
          </button>
        </div>

      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-split-pane>
