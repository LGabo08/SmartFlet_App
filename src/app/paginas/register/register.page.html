<ion-content fullscreen class="sf-reg">

  <div class="sf-reg-wrap">
    <div class="sf-reg-card">

      <div class="sf-reg-brand">SmartFlet</div>

      <!-- ✅ título dinámico -->
      <div class="sf-reg-title">{{ isEdit ? 'Editar Usuario' : 'Registrar Usuario' }}</div>

      <form
        class="sf-form"
        [formGroup]="registerForm"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
      >

        <!-- Señuelos anti-autofill -->
        <input type="text" name="fake-user" autocomplete="username" style="display:none" />
        <input type="password" name="fake-pass" autocomplete="new-password" style="display:none" />

        <!-- Fila 1: Nombres | Apellidos | Rol -->
        <div class="sf-grid sf-grid--3">
          <div class="sf-field">
            <label class="sf-label">Nombres</label>
            <input
              class="sf-input"
              type="text"
              formControlName="nombre"
              name="sf-nombres"
              autocomplete="given-name"
              spellcheck="false"
              autocapitalize="words"
              autocorrect="off"
            />
          </div>

          <div class="sf-field">
            <label class="sf-label">Apellidos</label>
            <input
              class="sf-input"
              type="text"
              formControlName="apellidos"
              name="sf-apellidos"
              autocomplete="family-name"
              spellcheck="false"
              autocapitalize="words"
              autocorrect="off"
            />
          </div>

          <div class="sf-field">
            <label class="sf-label">Rol</label>
            <select class="sf-input" formControlName="role_id" name="sf-role" autocomplete="off">
              <option [value]="1">Administrador</option>
              <option [value]="2">Coordinador</option>
            </select>
          </div>
        </div>

        <!-- Fila 2: Email (ancho) | Estado -->
        <div class="sf-grid sf-grid--email">
          <div class="sf-field">
            <label class="sf-label">Email</label>
            <input
              class="sf-input"
              type="email"
              formControlName="email"
              name="sf-email"
              autocomplete="username"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
            />
          </div>

          <div class="sf-field">
            <label class="sf-label">Estado</label>
            <select class="sf-input" formControlName="estado" name="sf-estado" autocomplete="off">
              <option value="ACTIVO">Activo</option>
              <option value="INACTIVO">Inactivo</option>
            </select>
          </div>
        </div>

        <!-- ✅ Solo en editar mostramos una ayuda -->
        <div class="sf-hint" *ngIf="isEdit">
          Si no deseas cambiar la contraseña, deja los campos vacíos.
        </div>

        <!-- Fila 3: Contraseña | Repetir contraseña -->
        <div class="sf-grid sf-grid--pass">
          <div class="sf-field">
            <label class="sf-label">Contraseña</label>

            <div class="sf-pass">
              <input
                class="sf-input sf-input--pass"
                [type]="showPass ? 'text' : 'password'"
                formControlName="contrasena"
                name="sf-new-password"
                autocomplete="new-password"
                [placeholder]="isEdit ? 'Nueva contraseña (opcional)' : 'Contraseña'"
              />

              <button
                class="sf-eye"
                type="button"
                (click)="showPass = !showPass"
                [attr.aria-label]="showPass ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <ion-icon [icon]="showPass ? eyeOffOutline : eyeOutline"></ion-icon>
              </button>
            </div>
          </div>

          <div class="sf-field">
            <label class="sf-label">Repetir contraseña</label>

            <input
              class="sf-input"
              [type]="showPass ? 'text' : 'password'"
              formControlName="confirmarContrasena"
              name="sf-confirm-password"
              autocomplete="new-password"
              [placeholder]="isEdit ? 'Confirmar (opcional)' : 'Repetir contraseña'"
            />

            <div class="sf-error" *ngIf="showNoMatch">
              no coincide la contraseña
            </div>
          </div>
        </div>

        <!-- ✅ Botón dinámico -->
        <button class="sf-btn" type="submit" [disabled]="registerForm.invalid || showNoMatch || saving">
          {{ saving ? 'Guardando...' : (isEdit ? 'Guardar cambios' : 'Registrar') }}
        </button>

        <!-- ✅ botón volver solo cuando editas -->
        <button
          class="sf-btn ghost"
          type="button"
          *ngIf="isEdit"
          (click)="goBack()"
        >
          Volver al listado
        </button>

      </form>
    </div>
  </div>

</ion-content>
